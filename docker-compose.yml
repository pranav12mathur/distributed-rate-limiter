
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      API_KEY_DEMO: ${API_KEY_DEMO:-demo-key-1}
      API_KEY_PREMIUM: ${API_KEY_PREMIUM:-demo-key-2}
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-closed}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  load-balancer:
    image: haproxy:3.2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - gateway
    restart: unless-stopped
