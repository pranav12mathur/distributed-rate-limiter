
global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend gateway_frontend
    bind *:8080
    default_backend gateway_nodes

backend gateway_nodes
    balance roundrobin
    option httpchk GET /health/
    server-template gateway 1-5 gateway:3000 check resolvers docker init-addr libc,none
